<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
    <script src="cordova.js"></script>
    <script src="components/loader.js"></script>
    <link rel="stylesheet" href="components/loader.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        let numero01
        let numero02
        let resultado

        function somar() {
            numero01 = parseInt(document.getElementById('inputNumero01').value)
            numero02 = parseInt(document.getElementById('inputNumero02').value)
            
            resultado = numero01 + numero02

            document.getElementById('exibirResultado').innerHTML = resultado
        }
        function subtrair() {
            numero01 = parseInt(document.getElementById('inputNumero01').value)
            numero02 = parseInt(document.getElementById('inputNumero02').value)

            resultado = numero01 - numero02

            document.getElementById('exibirResultado').innerHTML = resultado
        }
         function dividir() {
        numero01 = parseInt(document.getElementById('inputNumero01').value)
        numero02 = parseInt(document.getElementById('inputNumero02').value)

        resultado = numero01 / numero02

        document.getElementById('exibirResultado').innerHTML = resultado
         }
    </script>
</head>
<body>
    <input type="number" id="inputNumero01" placeholder="Insira o primeiro número">
    <input type="number" id="inputNumero02" placeholder="Insira o segundo número">
    <input type="button" id="btnSomar" value="SOMAR" onclick="somar()">
    <input type="button" value="SUBTRAIR" onclick="subtrair()">
    <input type="button" value="DIVIDIR" onclick="dividir()">
    <h2 id="exibirResultado"></h2>
</body>
</html>
